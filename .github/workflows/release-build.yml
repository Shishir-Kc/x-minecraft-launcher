name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example, v0.68.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      NODE_OPTIONS: --max-old-space-size=32768
      NODE_ENV: production
      BUILD_NUMBER: ${{ github.run_number }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
      PUBLISHER: CN=SignPath Foundation, O=SignPath Foundation, L=Lewes, S=Delaware, C=US

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Python packaging tools
        if: ${{ runner.os == 'macOS' || runner.os == 'Windows' }}
        run: python3 -m pip install --break-system-packages --user packaging setuptools

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/electron
            ${{ github.workspace }}/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Linux packaging dependency
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --prefix=xmcl-keystone-ui build

      - name: Build Electron installers
        run: pnpm --prefix=xmcl-electron-app build:all

      - name: Upload packaged installers
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ runner.os }}
          path: xmcl-electron-app/build/output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then tag="$PUSH_TAG"; fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a tag like v0.68.0, got: $tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="${RELEASE_TAG#v}"
          if [ "$version" != "$expected" ]; then
            echo "package.json version ($version) does not match release tag ($RELEASE_TAG)"
            exit 1
          fi

      - name: Download packaged installers
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets

      - name: Publish release and upload installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Each platform bundle also contains shared files such as
          # LICENSE.electron.txt and manifest.json. Upload only distributable
          # installers and their checksums so asset names cannot collide.
          mapfile -t assets < <(find release-assets -type f \( \
            -name 'xmcl-*.exe' -o \
            -name 'xmcl-*.appx' -o \
            -name 'xmcl-*.dmg' -o \
            -name 'xmcl-*.zip' -o \
            -name 'xmcl-*.AppImage' -o \
            -name 'xmcl-*.deb' -o \
            -name 'xmcl-*.rpm' -o \
            -name 'xmcl-*.tar.xz' -o \
            -name 'xmcl-*.pacman' -o \
            -name 'xmcl-*.sha256' \
          \) | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No packaged installers were downloaded.'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset in "${assets[@]}"; do
              gh release upload "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
            done
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "XMCL $RELEASE_TAG" \
              --generate-notes
          fi
